services:
  - type: web
    name: candela-store
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: node run-production.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: candela-store
          property: host
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: ADMIN_EMAIL
        value: admin@candela.store
      - key: ADMIN_PASSWORD
        sync: false
